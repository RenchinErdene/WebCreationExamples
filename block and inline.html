<!DOCTYPE html>
<html>
    <head>
        <title>Block</title>
        <h1>DIV TEST</h1>
    </head>
    <style>
        div {
            border: 2px solid blue;
            padding: 10px;
            margin: 10px;
        }
        span {
            border: 2px solid red;
            padding: 10px;
            margin: 10px;
        }
    </style>
    <body>
        <div>
            <h2>This is a block element</h2>
            <p>Block elements take up the full width available, and always start on a new line.</p>
        </div>
        <span>
            <h2>This is an inline element</h2>
            <p>Inline elements only take up as much width as necessary, and do not start on a new line.</p>
        </span>
    </body>

</html>
