<!DOCTYPE html>
<html>
    <head>
        <title>CSS</title>
        <h2 style="text-align: center;">style test</h2>
    </head>
    <style>
       h1{
        color: green;
        text-align: center;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
       }
       body{
        background-color: lightgray;
       }
       table{
        background-color: thistle;
        border: 2px solid black;
        width: 50%;
       }
    </style>
    <body>
        <h1>Heading with style</h1>
        <h2>Heading without style</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Alice</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>25</td>
            </tr>
    </body>
